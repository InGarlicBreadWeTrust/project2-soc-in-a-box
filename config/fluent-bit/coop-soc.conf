# config/fluent-bit/coop-soc.conf — primary log collector. LOCAL-ONLY, no external @out.
#
# Invariant (security-assessment §2 / sec-verify check A): NO @out points off-box. Only local
# Loki and/or local file. No @http / @s3 / @kafka / @datadog / @splunk. No call-home.
# License: this file is a sample (Apache-2.0) — the co-op may adopt/modify freely.

# ---- INPUT: ICS protocol sensors + nftables/audit -------------------------------------
[INPUT]
  Name tail
  Tag  sensor.modbus
  Path /var/log/sensors/modbus.log
  [INPUT]
  Name tail
  Tag  sensor.dnp3
  Path /var/log/sensors/dnp3.log
  [INPUT]
  Name tail
  Tag  sensor.iec61850
  Path /var/log/sensors/iec61850.log

  [INPUT]
  Name tail
  Tag  net.nftables
  Path /var/log/coop-soc.nft.log

# ---- FILTER: none external; local enrichment only --------------------------------------
[FILTER]
  Name  modify
  Match *
  Add   coop_soc "true"
  Add   segment   "monitor-3050"

# ---- OUTPUT: LOCAL ONLY. NO EXTERNAL DESTINATION. --------------------------------------
# (a) local Loki (same host) — loopback only
[OUTPUT]
  Name  loki
  Host  127.0.0.1          # LOOPBACK ONLY — no remote_write, no external Loki
  Port  3100
  Labels { segment="monitor-3050" }
  @out  loki               # the only destination

# (b) local file (belt to suspenders; offline cache)
[OUTPUT]
  Name   file
  Path   /var/log/coop-soc-local
  File   collector.out

# >>>>>>> NO @http / @s3 / @kafka / @datadog / remote_write ANYWHERE.  <<<<<<<<
# If a co-op later needs a remote log store, it MUST be a co-op-owned endpoint on the
# local_mgmt/alert_endpoint netrange, never a public cloud.
