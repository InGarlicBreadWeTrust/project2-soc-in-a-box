# config/zeek/zeek.ics.cfg — Zeek with the ICS protocol scripts, PASSIVE, local-logging only.
#
# Invariant: Zeek is a pure passive packet/flow analyzer. It NEVER opens a socket toward the
# control VLAN. It logs ONLY to the local Fluent Bit tail (below). No cloud output, no remote.
# License: this sample config is Apache-2.0; the co-op may adopt/modify it freely.
#
# Zeek itself is a license mix (Zeek Script + MIT for parts; some BSD/MIT) — it is an INDEPENDENT
# binary that reads the loopback/SPAN-mirror interface. Keep it independent; do not feed its
# parsed data to a proprietary 3rd-party service.

# ---- 001-...: enable the ICS protocol scripts (these are the "eyes and ears") ----------
# Modbus: detects broadcast writes, abnormal coils, unexpected device IDs.
@load iot/modbus-analyzer
# DNP3: detects out-of-sequence, invalid-length, unexpected function codes, login attempts.
@load iot/dnp3-analyzer        # Zeek upstream ICS scripts (ISC); verify current paths
@load iot/iec61850-analyzer
@load iot/iec61850-seccom     # optional security-event extension
@load iot/general-iot-analyzer # optional, broad-coverage ICS/OT
@load iot/tls-fingerprint     # certificate/protocol-version anomaly (helps w/ MITM detection)

# ---- 002: LOCAL logging only (no cloud / no remote) ------------------------------------
@load files-rotation
@load reporting/zeek

# ---- 003: output only to local files that Fluent Bit tails (loopback) ------------------
FileLog::RotateLogsOnStart = F;
# Write to local log dir that the Fluent Bit tail in config/fluent-bit/coop-soc.conf reads.
# NO cloud / NO remote_log / NO @output to an external host.

# >>>>>>> Zeek is a PASSIVE analyzer: it receives on the mirror/loopback interface only   <<<<<<<
# It has NO interface that initiates traffic toward the control VLAN. Confirm the co-op's
# Zeek deployment does NOT add an output connector to any external endpoint.
# DNP3 / Modbus / IEC 61850 can be decoded for alerting using Zeek's ICS analyzer scripts.
# The co-op may also add dnp3-pcap / marlinspike for offline replay + canary validation.
